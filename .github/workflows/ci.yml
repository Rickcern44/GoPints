name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Go build, lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gopints
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: gopints/go.mod
          cache-dependency-path: gopints/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: gopints
          version: latest

      - name: Build server
        run: go build ./cmd/server

      - name: Test
        run: go test -race ./...

  frontend:
    name: Frontend lint, check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npx biome ci .

      - name: Type check (svelte-check)
        run: npm run check

      - name: Build
        run: npm run build
