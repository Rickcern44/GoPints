name: Publish

# Fires when release-prepare-backend.yml / release-prepare-web.yml finalizes a
# release-prep PR merge and publishes the GitHub release. Also bumps the
# k8s deployment manifest's image tag via a direct commit, but only after
# the corresponding image is confirmed pushed to GHCR (ArgoCD auto-syncs
# off this repo, so that ordering matters).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to (re)publish artifacts for, e.g. gopints-v0.5.1'
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  # ── Parse the per-package release tag (<package>-v<version>) ───────────────
  prepare:
    name: Parse release tag
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${{ github.event.inputs.tag_name || github.event.release.tag_name }}"
          echo "package=${TAG%%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#*-v}" >> "$GITHUB_OUTPUT"

  # ── Docker containers (web + server) ───────────────────────────────────────
  build-server:
    name: Build & push server container
    needs: prepare
    if: needs.prepare.outputs.package == 'gopints'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-server
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prepare.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./gopints
          file: ./gopints/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}

  build-web:
    name: Build & push web container
    needs: prepare
    if: needs.prepare.outputs.package == 'web'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-web
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prepare.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}

  # ── Agent binaries (GoReleaser) ────────────────────────────────────────────
  goreleaser:
    name: Build & attach agent binaries
    needs: prepare
    if: needs.prepare.outputs.package == 'gopints'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: gopints/go.mod
          cache-dependency-path: gopints/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: ~> v2
          workdir: gopints
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ needs.prepare.outputs.version }}

  # ── Infra manifest version bump (direct commit, only after the image is
  #    confirmed pushed) ───────────────────────────────────────────────────
  # ArgoCD auto-syncs off this repo, so the deployment.yaml image tag must
  # never point at a version that isn't actually in GHCR yet. Bumping it
  # here, after build-server/build-web succeed, guarantees that invariant —
  # it's why this isn't done in the pre-merge release-prep PR.
  bump-infra-version:
    name: Bump infra manifest image tag
    needs: [prepare, build-server, build-web]
    if: |
      always() &&
      (
        (needs.prepare.outputs.package == 'gopints' && needs.build-server.result == 'success') ||
        (needs.prepare.outputs.package == 'web' && needs.build-web.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Determine manifest path and image name
        id: target
        run: |
          case "${{ needs.prepare.outputs.package }}" in
            gopints)
              echo "manifest=gopints/infrastructure/deploy/deployment.yaml" >> "$GITHUB_OUTPUT"
              echo "image=gopints-server" >> "$GITHUB_OUTPUT"
              ;;
            web)
              echo "manifest=web/infrastructure/deploy/deployment.yaml" >> "$GITHUB_OUTPUT"
              echo "image=gopints-web" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown package: ${{ needs.prepare.outputs.package }}" >&2
              exit 1
              ;;
          esac

      - name: Update image tag and commit
        env:
          GIT_COMMIT_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          sed -i -E "s#(image: ${{ env.REGISTRY }}/rickcern44/${{ steps.target.outputs.image }}:).*#\1${{ needs.prepare.outputs.version }}#" "${{ steps.target.outputs.manifest }}"
          if git diff --quiet -- "${{ steps.target.outputs.manifest }}"; then
            echo "Manifest already at ${{ needs.prepare.outputs.version }}; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.target.outputs.manifest }}"
          git commit -m "chore(deploy): bump ${{ needs.prepare.outputs.package }} image tag to ${{ needs.prepare.outputs.version }}"
          git remote set-url origin "https://x-access-token:${GIT_COMMIT_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main
