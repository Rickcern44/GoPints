name: Release

# Every push to main that touches gopints/ or web/ releases whichever package(s)
# have releasable Conventional Commits (fix/feat/breaking) since their last
# <package>-v* tag: tag + GitHub Release, then build and publish artifacts.
# There is no release PR; main is the trigger. Nothing is committed back.
#
# workflow_dispatch re-publishes artifacts for an existing tag (e.g. after a
# failed build).
on:
  push:
    branches: [main]
    paths:
      - 'gopints/**'
      - 'web/**'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag to (re)publish artifacts for, e.g. gopints-v0.5.1'
        required: true

# Serialize runs so each one sees the tags created by the previous one.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ── Decide which packages release, and at what version ─────────────────────
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      gopints_version: ${{ steps.plan.outputs.gopints_version }}
      web_version: ${{ steps.plan.outputs.web_version }}
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute versions
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TAG_INPUT: ${{ github.event.inputs.tag_name }}
        run: |
          releases='[]'
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ ! "$TAG_INPUT" =~ ^(gopints|web)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "Invalid tag: $TAG_INPUT" >&2
              exit 1
            fi
            echo "${BASH_REMATCH[1]}_version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            for pkg in gopints web; do
              version="$(scripts/next-version.sh "$pkg")"
              echo "${pkg}_version=${version}" >> "$GITHUB_OUTPUT"
              if [[ -n "$version" ]]; then
                releases="$(jq -c --arg p "$pkg" --arg v "$version" '. + [{package: $p, version: $v}]' <<<"$releases")"
              fi
            done
          fi
          echo "releases=${releases}" >> "$GITHUB_OUTPUT"
          echo "Planned releases: ${releases}"

  # ── Tag + GitHub Release (notes from git-cliff) ────────────────────────────
  release:
    name: Release ${{ matrix.package }} v${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.releases != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        env:
          OUTPUT: release-notes.md
        with:
          config: ${{ matrix.package }}/cliff.toml
          args: --unreleased --tag ${{ matrix.package }}-v${{ matrix.version }} --strip header

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ matrix.package }}-v${{ matrix.version }}"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md

  # ── Docker containers (web + server) ───────────────────────────────────────
  build-server:
    name: Build & push server container
    needs: [plan, release]
    if: ${{ !cancelled() && needs.release.result != 'failure' && needs.plan.outputs.gopints_version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-server
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.plan.outputs.gopints_version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.plan.outputs.gopints_version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./gopints
          file: ./gopints/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.plan.outputs.gopints_version }}

  build-web:
    name: Build & push web container
    needs: [plan, release]
    if: ${{ !cancelled() && needs.release.result != 'failure' && needs.plan.outputs.web_version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-web
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.plan.outputs.web_version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.plan.outputs.web_version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.plan.outputs.web_version }}

  # ── Agent binaries (GoReleaser) ────────────────────────────────────────────
  goreleaser:
    name: Build & attach agent binaries
    needs: [plan, release]
    if: ${{ !cancelled() && needs.release.result != 'failure' && needs.plan.outputs.gopints_version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: gopints/go.mod
          cache-dependency-path: gopints/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: ~> v2
          workdir: gopints
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ needs.plan.outputs.gopints_version }}
