name: CI Backend

on:
  pull_request:
    branches: [main]
    paths:
      - 'gopints/**'
      - '!gopints/infrastructure/**'

jobs:
  backend:
    name: Go build, lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gopints
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: gopints/go.mod
          cache-dependency-path: gopints/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: gopints
          version: latest

      - name: Build server
        run: go build ./cmd/server

      - name: Test
        run: go test -race ./...
