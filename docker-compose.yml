# GoPints — docker-compose
#
# Pull pre-built images from GHCR (default):
#   docker compose pull && docker compose up -d
#
# Build locally instead:
#   docker compose up --build
#
# Override the image prefix or tags via environment variables:
#   GOPINTS_IMAGE=ghcr.io/your-org/your-repo  GOPINTS_SERVER_TAG=v1.2.3  GOPINTS_WEB_TAG=v0.5.0  docker compose up -d
#
# The server and web images now version independently, so each has its own tag variable.
#
# Local port mapping:  http://localhost:8081  (web)
# Production mapping:  port 80 via WEB_PORT=80 docker compose up -d

services:
  server:
    image: ${GOPINTS_IMAGE:-ghcr.io/rickcern44/gopints}-server:${GOPINTS_SERVER_TAG:-latest}
    build:
      context: ./gopints
      dockerfile: Dockerfile
    ports:
      - "9876:9876/udp"    # receives UDP pulses from the agent
    volumes:
      - db_data:/app/data
    environment:
      KEGERATOR_DB_PATH: /app/data/kegerator.db
      KEGERATOR_HTTP_ADDR: ":8080"
      KEGERATOR_UDP_ADDR: ":9876"
    restart: unless-stopped

  web:
    image: ${GOPINTS_IMAGE:-ghcr.io/rickcern44/gopints}-web:${GOPINTS_WEB_TAG:-latest}
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db_data:
