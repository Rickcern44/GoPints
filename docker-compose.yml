services:
  server:
    build:
      context: ./gopints
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "9876:9876/udp"
    volumes:
      - db_data:/app/data
    environment:
      KEGERATOR_DB_PATH: /app/data/kegerator.db
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db_data:
