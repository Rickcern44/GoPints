apiVersion: v1
kind: Service
metadata:
  # Named "server" (not "gopints-server") to match the hostname baked into
  # web/nginx.conf's proxy_pass, keeping DNS parity with docker-compose.
  name: server
  namespace: gopints
spec:
  selector:
    app: gopints-server
  ports:
    - port: 8080
      targetPort: 8080