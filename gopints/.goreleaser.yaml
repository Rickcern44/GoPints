version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: agent
    binary: gopints-agent
    main: ./cmd/agent
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}

# Produce flat binaries (no archive) so setup-agent.sh can download them directly.
# Output names match what the installer expects:
#   gopints-agent-linux-amd64
#   gopints-agent-linux-arm64
#   gopints-agent-linux-armv7
archives:
  - id: agent
    builds: [agent]
    name_template: "gopints-agent-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    format: binary

checksum:
  name_template: checksums.txt

release:
  # release-prepare-backend.yml already created the GitHub release; just append binaries to it.
  mode: append

changelog:
  disable: true
