version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gofmt
    - revive
    - unused
    - gosimple
    - ineffassign
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
    revive:
      rules:
        - name: exported
          disabled: true

issues:
  exclusions:
    rules:
      - path: "_test\\.go"
        linters: [errcheck]
