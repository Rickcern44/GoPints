version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gofmt
    - revive
    - unused
    - gosimple
    - ineffassign

linters-settings:
  errcheck:
    # Ignore errors from fmt.Fprintf and similar where the error is genuinely unactionable.
    ignore: "fmt:.*"
  revive:
    rules:
      - name: exported
        disabled: true  # Don't require doc comments on every exported symbol

issues:
  exclude-rules:
    # Test files don't need error checks on t.Helper-style defers.
    - path: "_test\\.go"
      linters: [errcheck]
